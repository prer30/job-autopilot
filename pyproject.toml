[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-autopilot"
version = "0.1.0"
description = "Finds CS & product roles from trusted job lists, pre-fills applications, and waits for you to click Submit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "playwright>=1.45",
  "pyyaml>=6",
  "requests>=2.31",
  "rich>=13",
]

[project.optional-dependencies]
ai = ["pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.setuptools.packages.find]
include = ["jobagent*"]

[tool.setuptools.package-data]
"jobagent.apply" = ["page.js"]
